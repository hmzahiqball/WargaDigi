# Compose produksi untuk deployment di server dengan Caddy sebagai reverse proxy.
# App hanya di-bind ke 127.0.0.1 (tidak publik); Caddy yang menghadap internet.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wargadigi-app
    container_name: wargadigi_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      # Hanya localhost. Caddy proxy wargadigi21.com -> 127.0.0.1:${APP_HOST_PORT}
      - "127.0.0.1:${APP_HOST_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/html/storage/app
    networks:
      - wargadigi

  db:
    image: mysql:8.0
    container_name: wargadigi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - wargadigi

volumes:
  db_data:
  storage_data:

networks:
  wargadigi:
    driver: bridge